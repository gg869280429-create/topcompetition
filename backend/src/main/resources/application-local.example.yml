# 复制为 application-local.yml 后填写本机值；实际文件已被 Git 忽略，不要覆盖已有文件。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/competition?useSSL=false&serverTimezone=Asia/Shanghai
    username: YOUR_DATABASE_USER
    password: YOUR_DATABASE_PASSWORD
jwt:
  secret: YOUR_RANDOM_SECRET_AT_LEAST_64_BYTES

app:
  avatar-oss:
    enabled: false
    endpoint: ""
    region: ""
    bucket: ""
    # 可以在本机填写，或保留占位符并在后端环境设置对应变量。
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
