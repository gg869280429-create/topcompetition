server:
  port: 8080

spring:
  profiles:
    # 本机 local / 测试 test / 生产 prod；IDE 或 SPRING_PROFILES_ACTIVE 可覆盖。
    default: local
  application:
    name: competition-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  expire-hours: 24
  header: Authorization
  prefix: "Bearer "

# 仅头像存入私有 OSS；凭据由 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 提供。
app:
  avatar-oss:
    enabled: ${AVATAR_OSS_ENABLED:false}
    endpoint: ${AVATAR_OSS_ENDPOINT:}
    region: ${AVATAR_OSS_REGION:}
    bucket: ${AVATAR_OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
